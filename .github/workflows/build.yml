# Checks both platforms on every push, so a change made on one host can't silently break the
# other. Each job runs what `make test`, `make clippy` and `make build` run on that platform's
# own host (mk/macos.mk, mk/windows.mk); deploying stays local.
#
# Run on demand (Actions > Build > Run workflow), each job also runs `make dist` and keeps the
# finished plugin as a zip on the run's page (Artifacts, kept 30 days). `make dist` downloads
# ONNX Runtime and the model (`make fetch`, about 850 MB), so those runs cache vendor/, keyed on
# the Makefiles that pin the downloads. Pushes and pull requests need neither.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DIST: ${{ github.event_name == 'workflow_dispatch' }}

# A manual run has its own group, so it doesn't cancel the push check on the same branch.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: klassifier
      # luac 5.1's source and build, on every run: lua.org is often unreachable from CI.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/.cache/lua-*
          key: luac-macos-${{ hashFiles('mk/macos.mk') }}
      # ONNX Runtime and the model, on demand (and luac again, in the same vendor/).
      - if: env.DIST == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: vendor-macos-${{ hashFiles('Makefile', 'mk/macos.mk') }}
      # The Makefile checks downloads with sha256sum, which older macOS images may lack.
      - run: command -v sha256sum || brew install coreutils
      # Lua syntax (luac 5.1, built from source), rustfmt, clippy and the tests.
      - run: make test
      - run: make clippy
      # The binaries and Klassifier.app, ad-hoc signed.
      - run: make build
      # On demand: the plugin in dist/, with ONNX Runtime and the model.
      - if: env.DIST == 'true'
        run: make dist
      # ditto keeps the executable bits and the app's signature, which a plain zip of the
      # folder (upload-artifact's own) would lose.
      - name: Zip the plugin
        if: env.DIST == 'true'
        id: zip
        run: |
          name=Klassifier-$(tools/version-name.sh)-macos.zip
          ditto -c -k --keepParent dist/Klassifier.lrplugin "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - if: env.DIST == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.zip.outputs.name }}
          archive: false
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  windows:
    # Cross-compiled with MinGW, as in WSL. The tests run on Linux (mk/windows.mk);
    # `make clippy` checks the Windows build, the review window included.
    name: Windows (MinGW cross-compile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 lua5.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: klassifier
      # ONNX Runtime with DirectML, and the model.
      - if: env.DIST == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: vendor-windows-${{ hashFiles('Makefile', 'mk/windows.mk') }}
      - run: make test
      - run: make clippy
      - run: make build
      # On demand: the plugin in dist/, with ONNX Runtime, DirectML and the model.
      - if: env.DIST == 'true'
        run: make dist
      - name: Zip the plugin
        if: env.DIST == 'true'
        id: zip
        run: |
          name=Klassifier-$(tools/version-name.sh)-windows.zip
          (cd dist && zip -qr "../$name" Klassifier.lrplugin)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - if: env.DIST == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.zip.outputs.name }}
          archive: false
          retention-days: 30
          overwrite: true
          if-no-files-found: error
